# Configuration that connects the MAXI synoptic panel to the simulator (sim/maxi_sim.py) on its
# default port. See maxi_synoptic.yaml for the meaning of the keys.
#
#   python sim/maxi_sim.py --drift
#   python -m pydm_launcher.main -m config=maxi_synoptic_sim.yaml maxi_synoptic.py
#
# The addresses are full tango:// addresses, so no tango_host is needed. "#dbase=no" tells Tango
# that the simulator runs without a database.

values:
  DIODE_current_value:
    source: tango://localhost:45678/maxi/sim/1/diode_current#dbase=no
    format: '%.3e'
  DIODE_amplification_value:
    source: tango://localhost:45678/maxi/sim/1/diode_amplification#dbase=no
    format: '%.0e'
  DIODE_encoder_value:
    source: tango://localhost:45678/maxi/sim/1/diode_encoder#dbase=no
  MAXI_VAC_pressure_value:
    source: tango://localhost:45678/maxi/sim/1/maxi_vac_pressure#dbase=no
    format: '%.2e'
  MAXI_VAC_roughing_pressure_value:
    source: tango://localhost:45678/maxi/sim/1/maxi_vac_roughing_pressure#dbase=no
    format: '%.2e'
  SHUTTER_VAC_pressure_value:
    source: tango://localhost:45678/maxi/sim/1/shutter_vac_pressure#dbase=no
    format: '%.2e'
  SHUTTER_VAC_roughing_pressure_value:
    source: tango://localhost:45678/maxi/sim/1/shutter_vac_roughing_pressure#dbase=no
    format: '%.2e'
  DIFF_VAC_pressure_value:
    source: tango://localhost:45678/maxi/sim/1/diff_vac_pressure#dbase=no
    format: '%.2e'
  DIFF_VAC_roughing_pressure_value:
    source: tango://localhost:45678/maxi/sim/1/diff_vac_roughing_pressure#dbase=no
    format: '%.2e'
  BEAMLINE_status_value:
    source: tango://localhost:45678/maxi/sim/1/beamline_status#dbase=no
  BEAMLINE_energy_value:
    source: tango://localhost:45678/maxi/sim/1/beamline_energy#dbase=no
  BEAMLINE_polarization_value:
    source: tango://localhost:45678/maxi/sim/1/beamline_polarization#dbase=no
  BEAMLINE_exit_slit_value:
    source: tango://localhost:45678/maxi/sim/1/beamline_exit_slit#dbase=no
  DETECTOR_status_value:
    source: tango://localhost:45678/maxi/sim/1/detector_status#dbase=no
  DETECTOR_temp_value:
    source: tango://localhost:45678/maxi/sim/1/detector_temp#dbase=no
  DETECTOR_temp_setpoint_value:
    source: tango://localhost:45678/maxi/sim/1/detector_temp_setpoint#dbase=no
  MAGNET_current_amplitude_value:
    source: tango://localhost:45678/maxi/sim/1/magnet_current_amplitude#dbase=no
  MAGNET_current_angle_value:
    source: tango://localhost:45678/maxi/sim/1/magnet_current_angle#dbase=no
  SHUTTER_PANEL_mode_value:
    source: tango://localhost:45678/maxi/sim/1/shutter_panel_mode#dbase=no
  SHUTTER_PANEL_status_value:
    source: tango://localhost:45678/maxi/sim/1/shutter_panel_status#dbase=no
plots:
  MAXI_VAC_plot:
    source: tango://localhost:45678/maxi/sim/1/maxi_vac_pressure#dbase=no
    refresh_period: 1.0
    log_y: true
    y_range:
    - 1.0e-08
    - 1100.0
  SHUTTER_VAC_plot:
    source: tango://localhost:45678/maxi/sim/1/shutter_vac_pressure#dbase=no
    refresh_period: 1.0
    log_y: true
    y_range:
    - 1.0e-08
    - 1100.0
  DIFF_VAC_plot:
    source: tango://localhost:45678/maxi/sim/1/diff_vac_pressure#dbase=no
    refresh_period: 1.0
    log_y: true
    y_range:
    - 1.0e-08
    - 1100.0
extra_channels:
  chamber_pressure: tango://localhost:45678/maxi/sim/1/maxi_vac_pressure#dbase=no
  detector_temperature: tango://localhost:45678/maxi/sim/1/detector_temp#dbase=no
  valve_open: tango://localhost:45678/maxi/sim/1/valve_open#dbase=no
  shutter_open: tango://localhost:45678/maxi/sim/1/shutter_open#dbase=no
